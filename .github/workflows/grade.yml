name: Go Auto-Grader
on: [push]

# This tells ALL steps to run inside your project subfolder
defaults:
  run:
    working-directory: ./steady-stream-gateway

jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
      - name: Run Tests
        run: go test -v ./...