name: Hackathon Grader
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: '1.24'
    - name: Run Unit & Race Tests
      run: go test -v -race ./...
    - name: Install Load Tester (Hey)
      run: go install github.com/rakyll/hey@latest
    - name: Start API Gateway in background
      run: go run . &
    - name: Wait for server readiness
      run: sleep 3
    - name: Run Load Test (Simulating 50 concurrent users)
      run: ~/go/bin/hey -z 5s -c 50 http://localhost:8080/api/fast > load_test_results.txt
    - name: Display Load Test Results
      run: cat load_test_results.txt
