name: Hackathon Grader
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Run Unit & Race Tests
      run: go test -v ./...

    - name: Install Load Tester (Hey)
      run: go install github.com/rakyll/hey@latest

    - name: Start API Gateway in background
      run: go run . &

    - name: Wait for server readiness
      run: sleep 3

    - name: 🧪 Functional Rate Limit Test (15 Burst Requests)
      run: |
        echo "Testing burst capacity (Expected: 10 OK, 5 Too Many Requests)"
        SUCCESS_COUNT=0
        LIMIT_COUNT=0
        for i in {1..15}; do
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/fast)
          if [ "$STATUS" == "200" ]; then
            SUCCESS_COUNT=$((SUCCESS_COUNT+1))
          elif [ "$STATUS" == "429" ]; then
            LIMIT_COUNT=$((LIMIT_COUNT+1))
          fi
        done
        echo "Results -> 200 OK: $SUCCESS_COUNT, 429 Too Many Requests: $LIMIT_COUNT"
        if [ $LIMIT_COUNT -eq 0 ]; then
          echo "❌ Error: Rate limiter did not block any requests!"
          exit 1
        fi

    - name: 🔥 Maximum Throughput & Stress Test (200 Concurrent Users)
      run: |
        echo "Hammering the gateway with 200 concurrent users for 10 seconds..."
        ~/go/bin/hey -z 10s -c 200 http://localhost:8080/api/fast > load_test_results.txt
    
    - name: 📊 Final Grading Report
      run: |
        cat load_test_results.txt
        echo "--- Grading Summary ---"
        OK_COUNT=$(grep "\[200\]" load_test_results.txt | awk '{print $2}')
        LIMIT_COUNT=$(grep "\[429\]" load_test_results.txt | awk '{print $2}')
        echo "Successful Requests: $OK_COUNT"
        echo "Rate Limited Requests: $LIMIT_COUNT"
        if [ "$LIMIT_COUNT" -gt "0" ]; then
           echo "✅ GRADE: PASS - Rate limiter is active and protecting the backend."
        else
           echo "❌ GRADE: FAIL - Rate limiter allowed all requests through."
           exit 1
        fi
